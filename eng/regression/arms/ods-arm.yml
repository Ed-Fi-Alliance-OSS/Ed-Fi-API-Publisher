# One ODS/API regression arm built from published Docker Hub images (PostgreSQL). Which arm this is comes
# entirely from the --env-file (arm-a.env, arm-b.env, arm-c.env): image tag, ports, credentials.
#
#   api-source  -> EdFi_Ods_Populated (Grand Bend sample data)   publisher SOURCE
#   api-target  -> EdFi_Ods_Minimal   (descriptors only)         publisher TARGET
#   db-ods      sandbox image shipping both templates; Start-RegressionArm clones them into the two databases
#   db-admin    EdFi_Admin + EdFi_Security, shared by both APIs; bootstrap-pgsql.sql adds the instances and clients
#   proxy       WireMock in proxy mode in front of api-source (profile "proxy"); the fault mappings are loaded
#               on demand by the item scripts through its admin API, nothing is auto-loaded
#   swagger     optional (profile "swagger")
#
#   Every port is published on 127.0.0.1 only: the WireMock admin API is unauthenticated and its journal holds the
#   Authorization headers the publisher sent, and the APIs and databases use development credentials.
#
#   docker compose --env-file arm-b.env -f ods-arm.yml --profile proxy up -d --wait
#   ..\Start-Arm.ps1 -Arm B          # does the above plus the database clones and the Admin bootstrap

name: ${COMPOSE_PROJECT_NAME}

x-api: &api
  image: edfialliance/ods-api-web-api:${ODS_IMAGE_TAG}
  environment:
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_PORT: 5432
    ODS_POSTGRES_HOST: db-ods
    ADMIN_POSTGRES_HOST: db-admin
    PATH_BASE: ""
    TPDM_ENABLED: ${TPDM_ENABLED:-true}
    NPG_POOLING_ENABLED: ${NPG_POOLING_ENABLED:-true}
    NPG_API_MAX_POOL_SIZE_ODS: ${NPG_API_MAX_POOL_SIZE_ODS:-50}
    NPG_API_MAX_POOL_SIZE_ADMIN: ${NPG_API_MAX_POOL_SIZE_ADMIN:-10}
    NPG_API_MAX_POOL_SIZE_SECURITY: ${NPG_API_MAX_POOL_SIZE_SECURITY:-10}
    NPG_API_MAX_POOL_SIZE_MASTER: ${NPG_API_MAX_POOL_SIZE_MASTER:-10}
    ODS_CONNECTION_STRING_ENCRYPTION_KEY: ${ODS_CONNECTION_STRING_ENCRYPTION_KEY}
    # The ODS default of 15 live tokens per client is exhausted by a handful of short publisher runs (each run takes
    # a source and a target token); the regression is not about that limit, so it is raised.
    ApiSettings__BearerTokenPerClientLimit: ${BEARER_TOKEN_PER_CLIENT_LIMIT:-1000}
  depends_on:
    db-ods:
      condition: service_healthy
    db-admin:
      condition: service_healthy
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "wget --no-verbose --tries=1 --output-document=/dev/null http://localhost/health || exit 1"]
    start_period: "90s"
    interval: 15s
    retries: 5

services:
  db-ods:
    image: edfialliance/ods-api-db-ods-sandbox:${ODS_IMAGE_TAG}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TPDM_ENABLED: ${TPDM_ENABLED:-true}
    # Both APIs share this server, each with an ODS pool of up to NPG_API_MAX_POOL_SIZE_ODS plus the admin, security and
    # master pools: the default of 100 connections runs out under item 13's HighParallelism scenario ("too many clients
    # already", a 500 on a source page, 2026-09-29).
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}"]
    volumes:
      - vol-db-ods:/var/lib/postgresql/data
    restart: unless-stopped
    # -h localhost: over TCP. While the image's first-start init loads the templates, the entrypoint's temporary server
    # answers pg_isready on the socket only, which made the arm "healthy" minutes before the templates existed.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -d ${POSTGRES_DB:-postgres} -U ${POSTGRES_USER}"]
      start_period: "120s"
      interval: 10s
      retries: 30

  db-admin:
    image: edfialliance/ods-api-db-admin:${ODS_IMAGE_TAG}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      # Host access for item 10 (PostgreSQL configuration store lives in this instance).
      - "127.0.0.1:${ADMIN_DB_PORT}:5432"
    volumes:
      - vol-db-admin:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -d ${POSTGRES_DB:-postgres} -U ${POSTGRES_USER}"]
      start_period: "60s"
      interval: 10s
      retries: 30

  api-source:
    <<: *api
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: 5432
      ODS_POSTGRES_HOST: db-ods
      ADMIN_POSTGRES_HOST: db-admin
      PATH_BASE: ""
      TPDM_ENABLED: ${TPDM_ENABLED:-true}
      NPG_POOLING_ENABLED: ${NPG_POOLING_ENABLED:-true}
      NPG_API_MAX_POOL_SIZE_ODS: ${NPG_API_MAX_POOL_SIZE_ODS:-50}
      NPG_API_MAX_POOL_SIZE_ADMIN: ${NPG_API_MAX_POOL_SIZE_ADMIN:-10}
      NPG_API_MAX_POOL_SIZE_SECURITY: ${NPG_API_MAX_POOL_SIZE_SECURITY:-10}
      NPG_API_MAX_POOL_SIZE_MASTER: ${NPG_API_MAX_POOL_SIZE_MASTER:-10}
      ODS_CONNECTION_STRING_ENCRYPTION_KEY: ${ODS_CONNECTION_STRING_ENCRYPTION_KEY}
      # Token lifetime the source hands out. 30 (the ODS default) for the ticket run; a small value such as 4
      # makes item 4's refresh scenarios reproducible in minutes on a dry run.
      ApiSettings__BearerTokenTimeoutMinutes: ${SOURCE_TOKEN_TIMEOUT_MINUTES:-30}
      ApiSettings__BearerTokenPerClientLimit: ${BEARER_TOKEN_PER_CLIENT_LIMIT:-1000}
    volumes:
      - ${LOGS_FOLDER:-./.logs}/${COMPOSE_PROJECT_NAME}/api-source:/app/logs
    ports:
      - "127.0.0.1:${SOURCE_PORT}:80"

  api-target:
    <<: *api
    volumes:
      - ${LOGS_FOLDER:-./.logs}/${COMPOSE_PROJECT_NAME}/api-target:/app/logs
    ports:
      - "127.0.0.1:${TARGET_PORT}:80"

  proxy:
    image: wiremock/wiremock:${WIREMOCK_TAG:-3.13.2}
    profiles: ["proxy"]
    # The pass-through to api-source is a mapping file (../proxy/wiremock/mappings) rather than --proxy-all, so a
    # mappings reset from the item scripts restores it instead of dropping it. --preserve-host-header keeps the
    # Host the publisher used (localhost:<PROXY_PORT> or proxy:8080), so the URLs the ODS writes into its Discovery
    # document point back through the proxy and Discovery-based routing (APIPUB-108) does not bypass the faults.
    # The journal is what proves the in-flight cap (item 12).
    command: >-
      --preserve-host-header
      --disable-banner
      --max-request-journal-entries=1000000
    # PROXY_FORWARD_URL (a Northridge long run) forwards to the host; this name resolves on Linux engines too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../proxy/wiremock/mappings:/home/wiremock/mappings:ro
    ports:
      - "127.0.0.1:${PROXY_PORT}:8080"
    depends_on:
      api-source:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/__admin/mappings > /dev/null || exit 1"]
      start_period: "30s"
      interval: 10s
      retries: 10

  swagger:
    image: edfialliance/ods-api-swaggerui:${ODS_IMAGE_TAG}
    profiles: ["swagger"]
    environment:
      SAMPLE_KEY: ${SOURCE_KEY}
      SAMPLE_SECRET: ${SOURCE_SECRET}
      VERSION_URL: http://localhost:${SOURCE_PORT}
    ports:
      - "127.0.0.1:${SWAGGER_PORT}:80"
    depends_on:
      - api-source
    restart: unless-stopped

volumes:
  vol-db-ods:
  vol-db-admin:
